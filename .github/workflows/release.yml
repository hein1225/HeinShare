name: Build & Release

# 手动触发：填 tag 版本号（不带 v，例如 1.1.0）。
# 流程分两步，且严格串行——先「构建」，构建成功才会进入「发布」：
#   1) build：构建并签名 release APK，产出 artifact（含 APK 与更新日志）。
#   2) release：依赖 build 成功，下载 artifact，创建/覆盖 GitHub Release 并上传 APK。
# 任一构建步骤失败，发布 job 不会运行，不会产生半成品 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号（不带 v，例如 1.1.0）'
        required: true
        default: '1.1.0'
      changelog:
        description: '更新日志（留空则自动根据本次改动生成）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ───────────────────────────── 第一步：构建 ─────────────────────────────
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v3

      # ubuntu-latest 镜像已预装 Android SDK；android-actions/setup-android@v3 会调用
      # 已下线的 `sdkmanager tools` 导致失败，故改为按需用 sdkmanager 补装缺失组件。
      - name: 准备 Android SDK 组件
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "runner 上没有 sdkmanager"; exit 1
          fi
          chmod +x "$SDKMANAGER" 2>/dev/null || true
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          NEED=""
          if ! ls "$ANDROID_HOME/platforms"/android-34 >/dev/null 2>&1; then NEED="$NEED platforms;android-34"; fi
          if ! ls "$ANDROID_HOME/build-tools"/34.0.0 >/dev/null 2>&1; then NEED="$NEED build-tools;34.0.0"; fi
          if [ -n "$NEED" ]; then
            echo "安装缺失组件:$NEED"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" $NEED
          else
            echo "SDK 组件齐备"
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ks"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
            cat > "$RUNNER_TEMP/ks/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/ks/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "::add-mask::${KEYSTORE_PASSWORD}"
            echo "::add-mask::${KEY_PASSWORD}"
          else
            echo "未配置签名密钥，将构建未签名包"
          fi

      - name: 构建 Release APK
        working-directory: android
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          KS_ARGS=""
          if [ -f "$RUNNER_TEMP/ks/keystore.properties" ]; then
            KS_ARGS="-Pheinshare.keystore=$RUNNER_TEMP/ks/keystore.properties"
          fi
          # 海外 runner 改用 Gradle 官方发行源，避免国内镜像不可达
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          # 版本信息唯一数据源：android/version.properties
          # versionCode 是递增计数器，只在版本号升级时 +1，不使用时间戳
          VNAME=$(grep -E '^versionName=' version.properties | cut -d= -f2- | tr -d ' \r')
          VCODE=$(grep -E '^versionCode=' version.properties | cut -d= -f2- | tr -d ' \r')
          if [ "$VNAME" != "$TAG" ]; then
            echo "::error::version.properties 的 versionName($VNAME) 与发布标签($TAG) 不一致，请先更新版本号并递增 versionCode"
            exit 1
          fi
          echo "发布版本 $VNAME，versionCode=$VCODE"
          ./gradlew --no-daemon clean assembleRelease \
            -PversionName="$VNAME" \
            -PversionCode="$VCODE" \
            $KS_ARGS

      - name: 收集 APK
        id: collect
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "没有找到 APK"; exit 1
          fi
          cp "$APK" "dist/HeinShare-android-${TAG}.apk"
          ls -l dist

      - name: 生成更新日志
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          INPUT="${{ inputs.changelog }}"
          if [ -n "$INPUT" ]; then
            printf '%s\n' "$INPUT" > dist/notes.md
          else
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV" ]; then
              BODY=$(git log --pretty=format:'- %s' "${PREV}..HEAD" | head -n 50)
            else
              BODY=$(git log --pretty=format:'- %s' -n 20)
            fi
            {
              echo "版本 $TAG"
              echo ""
              echo "$BODY"
            } > dist/notes.md
          fi
          echo "----- notes.md -----"; cat dist/notes.md

      # 构建产物整体打包：APK + notes.md，作为发布 job 的输入。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-payload
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────── 第二步：发布 ─────────────────────────────
  # 仅当上面的 build job 成功才会执行；build 失败这里被自动跳过，不会发布。
  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: release-payload
          path: dist

      - name: 校验产物完整
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          APK="dist/HeinShare-android-${TAG}.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::构建产物缺少 $APK，拒绝发布"; exit 1
          fi
          if [ ! -f dist/notes.md ]; then
            echo "::error::构建产物缺少 notes.md，拒绝发布"; exit 1
          fi
          ls -l dist

      - name: 创建 Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APK="dist/HeinShare-android-${TAG}.apk"
          # tag 不带 v：直接用输入值
          # Release 已存在时改为覆盖上传，保证同名 tag 的资产能被新构建替换
          if gh release view "$TAG" --repo hein1225/HeinShare >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo hein1225/HeinShare
            gh release edit "$TAG" \
              --title "HeinShare-${TAG}" \
              --notes-file dist/notes.md \
              --repo hein1225/HeinShare
          else
            gh release create "$TAG" \
              --title "HeinShare-${TAG}" \
              --notes-file dist/notes.md \
              --repo hein1225/HeinShare \
              "$APK"
          fi
