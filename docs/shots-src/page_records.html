<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<style>
  body{padding:0;margin:0}
  .land{width:844px;height:390px}
  .land .screen{flex-direction:row}
  .land .tabbar{flex:0 0 76px;flex-direction:column;border-top:none;border-left:1px solid #EAF0F7;height:390px}
  .land .tab{flex:1}
  .land .homebar{display:none}
  .land .col-l{width:50%;padding:0 18px}
  .land .col-r{width:50%;padding:0 18px 0 0;overflow:hidden}
  .send-body{padding:4px 18px 0}
  .send-card{background:#fff;border-radius:24px;box-shadow:0 6px 20px rgba(31,111,224,.10);padding:20px}
  .heroart{display:flex;align-items:center;justify-content:center;padding:4px 0 14px}
  .file-row{display:flex;align-items:center;gap:12px;padding:9px 0}
  .file-row .ic{width:42px;height:42px;border-radius:50%;background:var(--blue-100);flex:0 0 42px;
    display:flex;align-items:center;justify-content:center}
  .file-row .nm{font-size:15px}
  .file-row .sz{margin-top:2px;font-size:12px;color:var(--ink-400)}
  .sep{height:1px;background:var(--line-soft);margin:12px 0}
  .dest{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800}
  .panel{background:linear-gradient(160deg,#EAF3FD,#E2EEFB);border-radius:18px;padding:16px;margin-top:16px}
  .bar{height:32px;border-radius:999px;background:#D6E3F2;overflow:hidden;position:relative}
  .bar>i{display:block;height:100%;width:68%;border-radius:999px;background:linear-gradient(90deg,var(--blue-500),var(--blue-600))}
  .bar>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
    font-size:15px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.25)}
  .stats{display:flex;justify-content:space-between;margin-top:14px;font-size:14px;color:var(--ink-500)}
  .stats b{color:var(--ink-900)}
  .btnrow{display:flex;gap:14px;margin-top:20px}
  .btn-outline{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:999px;padding:13px 0;
    font-size:16px;font-weight:800;color:var(--blue-600);background:#fff}
  .btn-solid{flex:1.3;text-align:center;border-radius:999px;padding:13px 0;color:#fff;font-size:17px;font-weight:800;
    background:linear-gradient(90deg,var(--blue-500),var(--blue-600));box-shadow:0 6px 16px rgba(47,134,245,.32)}
  .recv-card{background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(31,111,224,.10);
    margin:8px 18px;padding:20px}
  .recv-peer{display:flex;flex-direction:column;align-items:center;padding:12px 0 20px}
  .recv-peer .ic{width:72px;height:72px}
  .recv-peer .t{margin-top:14px;font-size:19px;font-weight:800;text-align:center}
  .setrow{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .setrow .ic{width:36px;height:36px;border-radius:50%;background:var(--blue-100);flex:0 0 36px;
    display:flex;align-items:center;justify-content:center}
  .setrow .mid{flex:1;min-width:0}
  .setrow .t{font-size:16px;font-weight:800}
  .setrow .d{margin-top:2px;font-size:12px;color:var(--ink-400)}
  .setrow .chev{color:var(--ink-400);font-size:20px}
  .toggles{width:52px;height:30px;border-radius:999px;background:linear-gradient(90deg,var(--blue-500),var(--blue-600));
    position:relative;flex:0 0 52px}
  .toggles::after{content:"";position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff}
  .sect{font-size:13px;font-weight:800;color:var(--ink-400);margin:20px 0 8px 4px}
</style></head><body>
